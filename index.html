<style>
  html { scroll-behavior: smooth; }
  body {
    font-family: 'IBM Plex Mono', monospace;
    background-color: #0a0a0d;
  }
  .heading { font-family: 'Space Grotesk', sans-serif; }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.18); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.28); }
  * { scrollbar-color: rgba(255,255,255,0.18) transparent; scrollbar-width: thin; }

  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }

  /* ---- animated ambient background ---- */
  #bgFx {
    position: fixed;
    inset: 0;
    z-index: -10;
    overflow: hidden;
    pointer-events: none;
  }
  #bgFx .blob {
    position: absolute;
    border-radius: 9999px;
    will-change: transform;
  }
  #bgFx .blob-a {
    width: 900px; height: 700px;
    left: -12%; top: -18%;
    background: radial-gradient(ellipse at center, rgba(109,94,245,0.35), transparent 62%);
    animation: driftA 24s ease-in-out infinite;
  }
  #bgFx .blob-b {
    width: 800px; height: 620px;
    right: -14%; bottom: -16%;
    background: radial-gradient(ellipse at center, rgba(109,94,245,0.20), transparent 58%);
    animation: driftB 30s ease-in-out infinite;
    animation-delay: -8s;
  }
  #bgFx .blob-c {
    width: 500px; height: 500px;
    left: 45%; top: 30%;
    background: radial-gradient(circle at center, rgba(109,94,245,0.10), transparent 65%);
    animation: driftC 34s ease-in-out infinite;
    animation-delay: -14s;
  }
  @keyframes driftA {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(40px, 35px) scale(1.08); }
  }
  @keyframes driftB {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(-55px, -30px) scale(1.06); }
  }
  @keyframes driftC {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(30px, -45px) scale(1.12); }
  }
  @media (prefers-reduced-motion: reduce) {
    #bgFx .blob { animation: none !important; }
  }

  .stagger { animation-delay: var(--d, 0ms); }

  .card-img { transition: transform .6s cubic-bezier(.16,.84,.44,1); }
  .card:hover .card-img { transform: scale(1.06); }
  .card-overlay {
    opacity: 0;
    transition: opacity .35s ease;
    background: linear-gradient(180deg, rgba(10,10,13,0) 20%, rgba(10,10,13,.92) 100%);
  }
  .card:hover .card-overlay { opacity: 1; }
  .card-overlay-content {
    transform: translateY(8px);
    opacity: 0;
    transition: all .35s ease .05s;
  }
  .card:hover .card-overlay-content { transform: translateY(0); opacity: 1; }

  .quest-link { position: relative; }
  .quest-link::before {
    content: '';
    position: absolute; left: -16px; top: 50%; translate: 0 -50%;
    width: 3px; height: 0; background: #6d5ef5;
    transition: height .25s ease;
  }
  .quest-link:hover::before, .quest-link.active::before { height: 70%; }

  .modal-slide-enter { animation: slideFade .35s cubic-bezier(.16,.84,.44,1) both; }
  @keyframes slideFade {
    0% { opacity: 0; transform: translateX(var(--slide-x, 24px)); }
    100% { opacity: 1; transform: translateX(0); }
  }

  [data-reveal] { opacity: 0; }

  .quest-link.active { color: #fff; }
  .quest-link.active::before { height: 70%; }

  .project-figure { cursor: zoom-in; }
  .project-figure img { transition: transform .5s cubic-bezier(.16,.84,.44,1); }
  .project-figure:hover img { transform: scale(1.02); }
  .zoom-hint {
    opacity: 0; transition: opacity .25s ease;
  }
  .project-figure:hover .zoom-hint { opacity: 1; }

  .view-fade { animation: viewFade .45s cubic-bezier(.16,.84,.44,1) both; }
  @keyframes viewFade {
    0% { opacity: 0; transform: translateY(10px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  /* ---- glowing, rotating stroke for the sidebar CTA buttons ---- */
  @property --angle {
    syntax: '<angle>';
    inherits: false;
    initial-value: 0deg;
  }
  .glow-stroke {
    position: relative;
    z-index: 0;
    border: 1px solid rgba(255,255,255,0.12);
  }
  .glow-stroke::before {
    content: '';
    position: absolute;
    inset: -1.5px;
    z-index: -1;
    border-radius: inherit;
    padding: 1.5px;
    background: conic-gradient(from var(--angle, 0deg),
      transparent 0%,
      transparent 55%,
      var(--glow-color, #6d5ef5) 68%,
      #fff 74%,
      var(--glow-color, #6d5ef5) 80%,
      transparent 92%,
      transparent 100%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    filter: drop-shadow(0 0 5px var(--glow-color, #6d5ef5)) drop-shadow(0 0 10px var(--glow-color, #6d5ef5));
    animation: rotateGlow 3.2s linear infinite;
    opacity: 0.9;
  }
  @keyframes rotateGlow {
    to { --angle: 360deg; }
  }
  @media (prefers-reduced-motion: reduce) {
    .glow-stroke::before { animation: none; }
  }
</style>

/* ===================== MOBILE NAV DRAWER ===================== */
const sidebar = document.getElementById('sidebar');
const sidebarBackdrop = document.getElementById('sidebarBackdrop');
const menuToggle = document.getElementById('menuToggle');
const sidebarClose = document.getElementById('sidebarClose');
const hamburgerLines = menuToggle.querySelectorAll('.hamburger-line');

function openDrawer() {
  sidebar.classList.remove('translate-x-full');
  sidebar.classList.add('translate-x-0');
  sidebarBackdrop.classList.remove('hidden');
  menuToggle.setAttribute('aria-expanded', 'true');
  hamburgerLines[0].style.transform = 'translateY(7px) rotate(45deg)';
  hamburgerLines[1].style.opacity = '0';
  hamburgerLines[2].style.transform = 'translateY(-7px) rotate(-45deg)';
  document.body.style.overflow = 'hidden';
}
function closeDrawer() {
  sidebar.classList.add('translate-x-full');
  sidebar.classList.remove('translate-x-0');
  sidebarBackdrop.classList.add('hidden');
  menuToggle.setAttribute('aria-expanded', 'false');
  hamburgerLines[0].style.transform = '';
  hamburgerLines[1].style.opacity = '';
  hamburgerLines[2].style.transform = '';
  document.body.style.overflow = '';
}
function isDrawerOpen() { return sidebar.classList.contains('translate-x-0'); }

menuToggle.addEventListener('click', () => (isDrawerOpen() ? closeDrawer() : openDrawer()));
sidebarClose.addEventListener('click', closeDrawer);
sidebarBackdrop.addEventListener('click', closeDrawer);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && isDrawerOpen()) closeDrawer(); });

// close the drawer automatically after tapping any navigation item inside it (mobile only)
sidebar.addEventListener('click', (e) => {
  const target = e.target.closest('a, button.quest-btn');
  if (target && window.innerWidth < 1024) closeDrawer();
});

// keep drawer state sane if the viewport is resized past the desktop breakpoint
window.addEventListener('resize', () => {
  if (window.innerWidth >= 1024) closeDrawer();
});

const projectView = document.getElementById('projectView');

/* ===================== RENDER GRID (home) ===================== */
function renderGrid(filter = 'all') {
  grid.innerHTML = '';
  const list = projects.filter(p => filter === 'all' || p.category === filter);

  list.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'card group relative aspect-square overflow-hidden bg-neutral-900 border border-white/10 cursor-pointer';
    card.style.setProperty('--d', `${i * 60}ms`);
    card.dataset.reveal = '';
    card.dataset.project = p.id;

    card.innerHTML = `
      <img src="${p.images[0]}" alt="${p.title}" class="card-img w-full h-full object-cover" />
      <div class="card-overlay absolute inset-0"></div>
      <div class="card-overlay-content absolute inset-x-0 bottom-0 p-4 flex items-end justify-between gap-2">
        <div>
          ${p.badge ? `<p class="text-brand text-[11px] tracking-[0.15em] uppercase font-semibold mb-1">${p.badge}</p>` : ''}
          <p class="heading text-white font-semibold text-sm leading-snug">${p.title}</p>
          <p class="text-[10px] text-neutral-400 tracking-[0.1em] uppercase mt-1">${categoryLabel[p.category]}</p>
        </div>
        <span class="shrink-0 text-[10px] tracking-[0.1em] uppercase text-neutral-400 border border-white/20 px-2 py-1">${p.year}</span>
      </div>
    `;

    // clicking a home-grid card opens the project's standalone page
    card.addEventListener('click', () => { window.location.hash = `#/project/${p.id}`; });
    grid.appendChild(card);
  });

  requestAnimationFrame(() => {
    document.querySelectorAll('[data-reveal]').forEach(el => {
      el.classList.add('animate-fadeUp');
      el.style.opacity = '';
    });
  });
}

/* ===================== QUEST LOG (sidebar nav) ===================== */
function renderQuestLog(activeId = null) {
  questLog.innerHTML = '';
  const featured = projects.filter(p => p.featured);
  featured.forEach((p, i) => {
    const a = document.createElement('a');
    a.href = `#/project/${p.id}`;
    a.className = 'quest-link flex items-baseline gap-2 text-neutral-500 hover:text-white transition-colors' + (p.id === activeId ? ' active' : '');
    a.innerHTML = `<span class="text-brand text-[11px]">${String(i + 1).padStart(2, '0')}</span><span class="tracking-[0.02em]">${p.title.toUpperCase()}</span>`;
    questLog.appendChild(a);
  });
}

/* ===================== FILTERS (home only) ===================== */
const filterBtns = document.querySelectorAll('.filter-btn');
function setActiveFilter(filter) {
  filterBtns.forEach(b => {
    const isActive = b.dataset.filter === filter;
    b.classList.toggle('active', isActive);
    b.classList.toggle('text-white', isActive);
    b.classList.toggle('border-white/20', isActive);
    b.classList.toggle('text-neutral-500', !isActive);
    b.classList.toggle('border-transparent', !isActive);
  });
}
filterBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    const f = btn.dataset.filter;
    setActiveFilter(f);
    renderGrid(f);
  });
});
function resetFilter() {
  window.location.hash = '#/';
  setActiveFilter('all');
  renderGrid('all');
}

/* ===================== PROJECT DETAIL PAGE ===================== */
function renderProjectPage(id) {
  const idx = projects.findIndex(p => p.id === id);
  if (idx === -1) { window.location.hash = '#/'; return; }
  const p = projects[idx];
  const prevP = projects[(idx - 1 + projects.length) % projects.length];
  const nextP = projects[(idx + 1) % projects.length];

  projectView.innerHTML = `
    <div class="view-fade">
      <div class="flex items-center justify-between gap-4 flex-wrap text-[11px] tracking-[0.15em] uppercase">
        <a href="#/" class="text-brand hover:text-white transition-colors">← [ Return to Index Archive ]</a>
        <div class="flex items-center gap-4 text-neutral-500">
          <a href="#/project/${prevP.id}" class="hover:text-white transition-colors">← Prev</a>
          <span class="text-neutral-700">/</span>
          <a href="#/project/${nextP.id}" class="hover:text-white transition-colors">Next →</a>
        </div>
      </div>

      <div class="border-t border-white/10 mt-4 mb-8"></div>

      <h1 class="heading text-3xl sm:text-5xl font-bold text-white leading-[1.05] max-w-3xl">${p.title}</h1>
      <p class="mt-3 text-[11px] tracking-[0.2em] uppercase text-neutral-500">${p.subLabel || categoryLabel[p.category]}</p>
      <p class="mt-5 text-base sm:text-lg text-neutral-200 max-w-2xl leading-relaxed">${p.tagline}</p>
      <p class="mt-4 text-[13px] text-neutral-500 max-w-2xl leading-relaxed whitespace-pre-line">${p.description}</p>

      <div class="mt-10 flex flex-col gap-0">
        ${p.images.map((src, i) => `
          <figure class="project-figure relative bg-neutral-900 overflow-hidden aspect-video" data-img-index="${i}">
            <img src="${src}" alt="${p.title} — image ${i + 1}" class="w-full h-full object-cover block" loading="lazy" />
            <span class="zoom-hint absolute bottom-3 right-3 text-[10px] tracking-[0.15em] uppercase bg-black/60 border border-white/20 text-white px-2 py-1">⤢ View</span>
          </figure>
        `).join('')}
      </div>

      <div class="mt-14 pt-8 border-t border-white/10 flex items-center justify-between gap-4 text-[11px] tracking-[0.15em] uppercase">
        <a href="#/project/${prevP.id}" class="text-neutral-500 hover:text-white transition-colors">← ${prevP.title}</a>
        <a href="#/project/${nextP.id}" class="text-neutral-500 hover:text-white transition-colors text-right">${nextP.title} →</a>
      </div>
    </div>
  `;

  // wire up each image figure to open the modal, browsing this project's images
  projectView.querySelectorAll('.project-figure').forEach(fig => {
    fig.addEventListener('click', () => {
      openModal(p.id, parseInt(fig.dataset.imgIndex, 10));
    });
  });
}

/* ===================== ROUTER ===================== */
function showHome() {
  homeView.classList.remove('hidden');
  projectView.classList.add('hidden');
  renderQuestLog(null);
}
function showProject(id) {
  homeView.classList.add('hidden');
  projectView.classList.remove('hidden');
  renderProjectPage(id);
  renderQuestLog(id);
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
}

function handleRoute() {
  const hash = window.location.hash; // e.g. "#/project/p2" or "#/" or ""
  const match = hash.match(/^#\/project\/(.+)$/);
  if (match) {
    showProject(match[1]);
  } else {
    showHome();
  }
}

window.addEventListener('hashchange', handleRoute);

/* ===================== MODAL (image lightbox) ===================== */
const modal = document.getElementById('modal');
const modalImg = document.getElementById('modalImg');
const modalTitle = document.getElementById('modalTitle');
const modalMeta = document.getElementById('modalMeta');
const modalCount = document.getElementById('modalCount');
const modalBackdrop = document.getElementById('modalBackdrop');
const modalClose = document.getElementById('modalClose');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

let activeProject = null;
let activeIndex = 0;

function openModal(projectId, index) {
  activeProject = projects.find(p => p.id === projectId);
  activeIndex = index;
  renderModalImage(0);
  modal.classList.remove('hidden');
  modal.classList.add('flex');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  modal.classList.add('hidden');
  modal.classList.remove('flex');
  document.body.style.overflow = '';
}

function renderModalImage(dir) {
  modalImg.style.setProperty('--slide-x', dir >= 0 ? '24px' : '-24px');
  modalImg.classList.remove('modal-slide-enter');
  void modalImg.offsetWidth; // restart animation
  modalImg.classList.add('modal-slide-enter');

  modalImg.src = activeProject.images[activeIndex];
  modalImg.alt = activeProject.title;
  modalTitle.textContent = activeProject.title;
  modalMeta.textContent = `${categoryLabel[activeProject.category]} · ${activeProject.year}`;
  modalCount.textContent = `${activeIndex + 1} / ${activeProject.images.length}`;
}

function stepModal(dir) {
  if (!activeProject) return;
  const len = activeProject.images.length;
  activeIndex = (activeIndex + dir + len) % len;
  renderModalImage(dir);
}

modalClose.addEventListener('click', closeModal);
modalBackdrop.addEventListener('click', closeModal);
prevBtn.addEventListener('click', () => stepModal(-1));
nextBtn.addEventListener('click', () => stepModal(1));
document.addEventListener('keydown', (e) => {
  if (modal.classList.contains('hidden')) return;
  if (e.key === 'Escape') closeModal();
  if (e.key === 'ArrowLeft') stepModal(-1);
  if (e.key === 'ArrowRight') stepModal(1);
});

/* ===================== CLOCK + YEAR ===================== */
document.getElementById('year').textContent = new Date().getFullYear();
function tick() {
  const now = new Date();
  document.getElementById('clock').textContent =
    '🕐 ' + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}
tick();
setInterval(tick, 1000);

/* ===================== INIT ===================== */
renderGrid('all');
handleRoute();
</script>
</body>
</html>
